    <script>
      // Older Safari (16 and before; every iPhone/iPad browser is Safari underneath) paints a word's
      // outline over its letters: html.no-po switches to outlines it draws right (ui/oldSafari*.css).
      (function () {
        var ua = navigator.userAgent;
        if (!/AppleWebKit/.test(ua) || /Chrome\/|Chromium\/|Edg\//.test(ua)) return;
        var m = /\bOS (\d+)_\d+(?:_\d+)? like Mac OS X/.exec(ua) || /Version\/(\d+)[.\d]* (?:Mobile\/\S+ )?Safari\//.exec(ua);
        if (m && +m[1] < 17) document.documentElement.className += ' no-po';
      })();
    </script>
  </head>
