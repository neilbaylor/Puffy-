<meta name="theme-color" content="#0e1613">
<title>Range Day</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&family=Barlow+Condensed:ital,wght@0,600;0,700;1,700&family=Fraunces:opsz,wght@9..144,500;9..144,700&family=Russo+One&display=swap">
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #0e1613; touch-action: none; overscroll-behavior: none; }
  #app, #app canvas { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
  .intro { position: fixed; inset: 0; display: grid; align-items: end; justify-items: start; padding: max(24px, env(safe-area-inset-left)); background: linear-gradient(90deg, rgba(5,12,24,.72) 0%, rgba(5,12,24,.25) 45%, rgba(5,12,24,0) 70%); transition: opacity .6s; font-family: 'Barlow', system-ui, sans-serif; color: #fff; }
  .intro.gone { opacity: 0; pointer-events: none; }
  .intro-card { display: grid; gap: 6px; padding-bottom: max(16px, env(safe-area-inset-bottom)); }
  .intro .kick { font-family: 'Barlow Condensed', sans-serif; font-weight: 700; letter-spacing: .2em; text-transform: uppercase; color: #ffc72c; font-size: 14px; }
  .intro h1 { margin: 0; font-family: 'Barlow Condensed', sans-serif; font-weight: 700; font-size: clamp(56px, 12vw, 120px); line-height: .85; text-transform: uppercase; letter-spacing: .01em; text-shadow: 0 4px 24px rgba(0,0,0,.35); }
  .intro p { margin: 0 0 10px; color: #d7e0ee; font-size: 17px; }
  .intro button { justify-self: start; font: 700 18px/1 'Barlow Condensed', sans-serif; letter-spacing: .12em; text-transform: uppercase; color: #0a1630; background: #ffc72c; border: 0; padding: 14px 22px; cursor: pointer; clip-path: polygon(0 0, calc(100% - 12px) 0, 100% 12px, 100% 100%, 12px 100%, 0 calc(100% - 12px)); }
  .intro button:focus-visible { outline: 2px solid #fff; outline-offset: 3px; }
  .rotate { position: fixed; inset: 0; z-index: 50; display: none; place-items: center; text-align: center; background: #0e1613; color: #fff; font-family: 'Barlow', system-ui, sans-serif; padding: 24px; }
  .rotate b { display: block; font: 700 30px/1 'Barlow Condensed', sans-serif; text-transform: uppercase; letter-spacing: .04em; margin-bottom: 8px; color: #ffc72c; }
  .rotate svg { width: 72px; height: 72px; margin: 0 auto 16px; display: block; animation: tilt 2.4s ease-in-out infinite; }
  @keyframes tilt { 0%, 30% { transform: rotate(0); } 60%, 100% { transform: rotate(-90deg); } }
  @media (orientation: portrait) and (max-width: 700px) { .rotate { display: grid; } }
</style>
